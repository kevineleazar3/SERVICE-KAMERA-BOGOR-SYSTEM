<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Kamera Bogor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @page { margin: 1cm; }
    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { 
        position: absolute; 
        left: 0; 
        top: 0; 
        width: 100%; 
        font-size: 10pt; 
        color: #000 !important;
        background: #fff !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col items-center p-4">

  <div class="w-full max-w-3xl bg-slate-800 rounded-2xl shadow-xl p-6 my-4 border border-slate-700 no-print">
    <!-- Header Admin UI -->
    <div class="text-center border-b border-slate-700 pb-4 mb-6">
      <h1 class="text-2xl font-bold text-white">📷 Service Kamera Bogor</h1>
      <p class="text-sm text-slate-400 font-semibold tracking-wider">WEB ADMIN</p>
    </div>

    <!-- Integration Settings Google Sheets -->
    <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-700 mb-6 space-y-2">
      <label class="block text-xs font-semibold text-emerald-400">📊 Webhook Google Sheets (Laporan Keuangan Otomatis):</label>
      <div class="flex gap-2">
        <input type="text" id="sheetUrlInput" placeholder="Tempel URL Web App (https://script.google.com/macros/s/.../exec)" class="flex-1 p-2 bg-slate-800 border border-slate-700 rounded-lg text-xs outline-none text-white">
        <button onclick="saveSheetUrl()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-lg text-xs transition">Simpan URL</button>
      </div>
    </div>

    <!-- Upload Logo Perusahaan -->
    <div class="flex items-center gap-3 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700 mb-6">
      <img id="logoPreview" class="h-12 w-auto object-contain hidden bg-white p-1 rounded" alt="Logo Perusahaan">
      <div class="flex-1">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Logo Toko / Perusahaan (Untuk Nota/SPK):</label>
        <input type="file" id="inputLogo" accept="image/*" onchange="uploadLogo(event)" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer">
      </div>
      <button onclick="removeLogo()" id="btnRemoveLogo" class="text-xs bg-red-900/50 hover:bg-red-800 text-red-200 px-3 py-1.5 rounded-lg hidden transition">Hapus Logo</button>
    </div>

    <!-- Form SPK Baru -->
    <form onsubmit="createSPK(event)" class="border border-slate-700 rounded-2xl p-4 bg-slate-900/50 space-y-3 mb-6">
      <h3 class="font-bold text-sm text-blue-400 border-b border-slate-700 pb-2">➕ Buat SPK Baru</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input type="text" id="inputName" required placeholder="Nama Pelanggan" class="p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm outline-none focus:border-blue-500">
        <input type="tel" id="inputPhone" required placeholder="No. WhatsApp (contoh: 08123456789)" class="p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm outline-none focus:border-blue-500">
        <select id="inputType" class="p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm outline-none text-white">
          <option value="Kamera">Kamera</option>
          <option value="Lensa">Lensa</option>
        </select>
        <input type="text" id="inputModel" required placeholder="Merk & Tipe (misal: Sony A7 III)" class="p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Target Estimasi Selesai:</label>
        <input type="datetime-local" id="inputTarget" required class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm outline-none text-white">
      </div>

      <textarea id="inputIssue" required placeholder="Keluhan / Kelengkapan / Kondisi Awal Unit" rows="2" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-lg text-sm outline-none focus:border-blue-500"></textarea>
      
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow">
        Terbitkan SPK & Send WA Serah Terima
      </button>
    </form>

    <!-- Filter & List SPK -->
    <div class="space-y-3">
      <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-slate-700 pb-2">
        <h3 class="font-bold text-sm text-white">📋 Daftar SPK Service</h3>
        
        <div class="flex gap-1 text-xs">
          <button onclick="setFilter('all')" id="filterAll" class="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-medium">Semua</button>
          <button onclick="setFilter('active')" id="filterActive" class="px-2.5 py-1 rounded-lg bg-slate-700 text-slate-300">Aktif</button>
          <button onclick="setFilter('warning')" id="filterWarning" class="px-2.5 py-1 rounded-lg bg-slate-700 text-slate-300">⚠️ Warning</button>
          <button onclick="setFilter('completed')" id="filterCompleted" class="px-2.5 py-1 rounded-lg bg-slate-700 text-slate-300">Selesai</button>
        </div>
      </div>

      <div id="adminSpkList" class="space-y-3"></div>
    </div>
  </div>

  <!-- AREA PRINTABLE DOKUMEN CETAK/PDF (HITAM PUTIH) -->
  <div id="printableArea" class="hidden print:block p-4"></div>

  <script>
    const STATUS_STAGES = ["Diterima", "Diagnosa", "Pengerjaan", "Selesai"];
    let currentFilter = 'all';

    let spkData = JSON.parse(localStorage.getItem('spkData')) || [];
    let counter = parseInt(localStorage.getItem('spkCounter')) || 1;
    let logoData = localStorage.getItem('companyLogo') || '';
    let sheetScriptUrl = localStorage.getItem('sheetScriptUrl') || '';

    function saveData() {
      localStorage.setItem('spkData', JSON.stringify(spkData));
      localStorage.setItem('spkCounter', counter.toString());
    }

    function saveSheetUrl() {
      const url = document.getElementById('sheetUrlInput').value.trim();
      localStorage.setItem('sheetScriptUrl', url);
      sheetScriptUrl = url;
      alert("URL Webhook Google Sheets berhasil disimpan!");
    }

    function syncToGoogleSheets(item) {
      if (!sheetScriptUrl) return;

      const payload = {
        tanggal: new Date().toLocaleDateString('id-ID'),
        spkId: item.id,
        nama: item.name,
        phone: item.phone,
        unit: `${item.type} ${item.model}`,
        rincian: item.rincianBiaya || 'Jasa Service & Kalibrasi',
        biaya: item.biaya || 0
      };

      fetch(sheetScriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        console.log("Data berhasil dikirim ke Google Sheets.");
      }).catch(err => console.error("Gagal kirim ke Google Sheets:", err));
    }

    function uploadLogo(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          logoData = event.target.result;
          localStorage.setItem('companyLogo', logoData);
          showLogoPreview();
        };
        reader.readAsDataURL(file);
      }
    }

    function removeLogo() {
      logoData = '';
      localStorage.removeItem('companyLogo');
      document.getElementById('inputLogo').value = '';
      showLogoPreview();
    }

    function showLogoPreview() {
      const img = document.getElementById('logoPreview');
      const btnRem = document.getElementById('btnRemoveLogo');
      if (logoData) {
        img.src = logoData;
        img.classList.remove('hidden');
        btnRem.classList.remove('hidden');
      } else {
        img.src = '';
        img.classList.add('hidden');
        btnRem.classList.add('hidden');
      }
    }

    function getDeadlineStatus(targetStr, status) {
      if (status === 'Selesai') return { text: '✅ Selesai', color: 'bg-green-900/50 text-green-300 border-green-700', level: 3 };
      if (!targetStr) return { text: 'Tanpa Estimasi', color: 'bg-slate-700 text-slate-300 border-slate-600', level: 2 };

      const diffHours = (new Date(targetStr).getTime() - new Date().getTime()) / (1000 * 60 * 60);

      if (diffHours < 0) return { text: `🚨 LEWAT DEADLINE`, color: 'bg-red-900/60 text-red-200 border-red-500 font-bold animate-pulse', level: 0 };
      if (diffHours <= 24) return { text: `⚠️ DEADLINE DEKAT`, color: 'bg-amber-900/60 text-amber-200 border-amber-500 font-bold', level: 1 };
      return { text: `⏱️ Sisa ${Math.ceil(diffHours / 24)} Hari`, color: 'bg-blue-900/50 text-blue-200 border-blue-700', level: 2 };
    }

    window.addEventListener('DOMContentLoaded', () => {
      const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000);
      document.getElementById('inputTarget').value = tomorrow.toISOString().slice(0,16);
      document.getElementById('sheetUrlInput').value = sheetScriptUrl;
      showLogoPreview();
      renderAdminList();
    });

    function createSPK(e) {
      e.preventDefault();
      const now = new Date();
      const formattedDrop = now.toLocaleDateString('id-ID') + ', ' + now.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});

      const newSpk = {
        id: `SPK-00${counter++}`,
        name: document.getElementById('inputName').value,
        phone: document.getElementById('inputPhone').value,
        type: document.getElementById('inputType').value,
        model: document.getElementById('inputModel').value,
        issue: document.getElementById('inputIssue').value,
        status: "Diterima",
        notes: "Unit baru diterima di kasir.",
        createdAt: formattedDrop,
        targetDate: document.getElementById('inputTarget').value,
        biaya: 0,
        rincianBiaya: ""
      };

      spkData.unshift(newSpk);
      saveData();
      e.target.reset();
      
      const tomorrow = new Date(Date.now() + 24 * 60 * 60 * 1000);
      document.getElementById('inputTarget').value = tomorrow.toISOString().slice(0,16);

      renderAdminList();
      sendWaSerahTerima(newSpk);
    }

    function sendWaSerahTerima(item) {
      let phone = item.phone.replace(/[^0-9]/g, '');
      if (phone.startsWith('0')) phone = '62' + phone.slice(1);

      const trackingUrl = `${window.location.origin}/index.html?spk=${item.id}`;

      const text = `Halo Kak *${item.name}*,\n\nTerima kasih telah melakukan perbaikan unit di *Service Kamera Bogor*.\n\nBerikut *BUKTI TANDA TERIMA UNIT (SPK)* Anda:\n\n📋 *No. SPK:* ${item.id}\n📥 *Waktu Drop:* ${item.createdAt}\n📷 *Unit:* ${item.type} - ${item.model}\n⚠️ *Keluhan:* ${item.issue}\n\nLacak progress perbaikan unit Anda kapan saja via link berikut:\n${trackingUrl}`;

      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function editSPK(index) {
      const item = spkData[index];

      const newName = prompt("Edit Nama Pelanggan:", item.name);
      if (newName === null) return;

      const newPhone = prompt("Edit No. WhatsApp:", item.phone);
      if (newPhone === null) return;

      const newBiaya = prompt("Edit Total Biaya Service (Rp):", item.biaya || 0);
      if (newBiaya === null) return;

      const newRincian = prompt("Edit Rincian Pekerjaan / Sparepart:", item.rincianBiaya || "");

      item.name = newName.trim() || item.name;
      item.phone = newPhone.trim() || item.phone;
      item.biaya = parseInt(newBiaya) || 0;
      if (newRincian !== null) item.rincianBiaya = newRincian.trim();

      saveData();
      renderAdminList();

      if (item.status === 'Selesai' && item.biaya > 0) {
        syncToGoogleSheets(item);
      }
    }

    // FUNGSI KHUSUS TOMBOL PEMBAYARAN / LUNAS
    function processPayment(index) {
      const item = spkData[index];
      const inputBiaya = prompt(`Konfirmasi Pembayaran SPK ${item.id}\nMasukkan Total Biaya Service (Rp):`, item.biaya || "350000");
      
      if (inputBiaya !== null) {
        item.biaya = parseInt(inputBiaya) || 0;
        item.rincianBiaya = prompt("Masukkan Rincian Pekerjaan / Sparepart:", item.rincianBiaya || "Jasa Service & Kalibrasi Unit") || "";
        item.status = "Selesai";
        
        saveData();
        renderAdminList();

        // 1. Sinkronisasi Otomatis ke Google Sheets Laporan Keuangan
        syncToGoogleSheets(item);
        
        // 2. Buka WhatsApp Invoice ke Pelanggan
        sendWaInvoice(item);
      }
    }

    function updateStatus(index, newStatus) {
      const item = spkData[index];
      item.status = newStatus;

      if (newStatus === 'Selesai') {
        processPayment(index);
      } else {
        saveData();
        renderAdminList();
      }
    }

    function sendWaInvoice(item) {
      let phone = item.phone.replace(/[^0-9]/g, '');
      if (phone.startsWith('0')) phone = '62' + phone.slice(1);

      const trackingUrl = `${window.location.origin}/index.html?spk=${item.id}`;

      const text = `Halo Kak *${item.name}*,\n\nPerbaikan unit Kamera/Lensa Anda telah *SELESAI* dikerjakan dan siap diambil.\n\n🧾 *INVOICE PEMBAYARAN SERVICE*\n📋 *No. SPK:* ${item.id}\n📷 *Unit:* ${item.type} - ${item.model}\n🛠️ *Rincian:* ${item.rincianBiaya || 'Jasa Service Complete'}\n💰 *TOTAL BIAYA:* *Rp ${Number(item.biaya).toLocaleString('id-ID')}*\n\nLacak detail nota & status perbaikan:\n${trackingUrl}`;

      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
    }

    function updateNotes(index, newNotes) {
      spkData[index].notes = newNotes;
      saveData();
    }

    function setFilter(filterType) {
      currentFilter = filterType;
      ['All', 'Active', 'Warning', 'Completed'].forEach(f => {
        const btn = document.getElementById(`filter${f}`);
        if (f.toLowerCase() === filterType) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-blue-600 text-white font-medium';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg bg-slate-700 text-slate-300';
        }
      });
      renderAdminList();
    }

    function renderAdminList() {
      const container = document.getElementById('adminSpkList');
      container.innerHTML = '';

      let filtered = spkData.filter(item => {
        if (currentFilter === 'active') return item.status !== 'Selesai';
        if (currentFilter === 'completed') return item.status === 'Selesai';
        if (currentFilter === 'warning') {
          if (item.status === 'Selesai') return false;
          return getDeadlineStatus(item.targetDate, item.status).level <= 1;
        }
        return true;
      });

      filtered.sort((a, b) => {
        const statusA = getDeadlineStatus(a.targetDate, a.status);
        const statusB = getDeadlineStatus(b.targetDate, b.status);
        if (statusA.level !== statusB.level) return statusA.level - statusB.level;
        return new Date(a.targetDate || 0).getTime() - new Date(b.targetDate || 0).getTime();
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">Tidak ada data SPK.</p>';
        return;
      }

      filtered.forEach((item) => {
        const realIndex = spkData.findIndex(orig => orig.id === item.id);
        const deadline = getDeadlineStatus(item.targetDate, item.status);

        const card = document.createElement('div');
        card.className = `p-4 border rounded-xl bg-slate-800/80 space-y-3 ${deadline.level === 0 ? 'border-red-500/50 bg-red-950/20' : 'border-slate-700'}`;
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="font-bold text-sm text-blue-400">${item.id}</span>
              <span class="text-xs text-slate-300 ml-2">${item.name} (${item.phone})</span>
              <p class="text-[11px] text-slate-400 mt-0.5">📥 Drop: ${item.createdAt || '-'}</p>
            </div>
            <span class="text-[11px] px-2 py-1 rounded border ${deadline.color}">${deadline.text}</span>
          </div>

          <div>
            <p class="text-sm font-semibold text-white">${item.type}: ${item.model}</p>
            <p class="text-xs text-slate-400">Kendala: ${item.issue}</p>
            <p class="text-xs font-bold text-emerald-400 mt-1">Biaya: Rp ${Number(item.biaya || 0).toLocaleString('id-ID')} ${item.rincianBiaya ? `(${item.rincianBiaya})` : ''}</p>
          </div>
          
          <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-700">
            <select onchange="updateStatus(${realIndex}, this.value)" class="text-xs p-2 border border-slate-700 rounded-lg flex-1 bg-slate-900 text-white">
              ${STATUS_STAGES.map(s => `<option value="${s}" ${item.status === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <input type="text" value="${item.notes}" onchange="updateNotes(${realIndex}, this.value)" placeholder="Catatan progress..." class="text-xs p-2 border border-slate-700 rounded-lg flex-1 bg-slate-900 text-white">
            
            <button onclick="editSPK(${realIndex})" class="text-xs bg-amber-600 hover:bg-amber-700 text-white font-medium px-3 py-2 rounded-lg transition">
              ✏️ Edit
            </button>
            <button onclick="processPayment(${realIndex})" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-2 rounded-lg transition">
              💳 Bayar & Selesai
            </button>
            <button onclick="printSPK(${realIndex})" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg transition">
              🖨️ Cetak SPK
            </button>
            ${item.status === 'Selesai' ? `
              <button onclick="printInvoice(${realIndex})" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-2 rounded-lg transition">
                🧾 Cetak Invoice
              </button>
            ` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function printSPK(index) {
      const item = spkData[index];
      const logoHtml = logoData ? `<img src="${logoData}" style="max-height: 55px; max-width: 160px; object-fit: contain; margin-bottom: 5px;">` : '';

      document.getElementById('printableArea').innerHTML = `
        <div style="font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; color: #000; line-height: 1.4;">
          <table style="width: 100%; border-collapse: collapse; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 15px;">
            <tr>
              <td style="vertical-align: top; width: 60%;">
                ${logoHtml}
                <h2 style="margin: 0; font-size: 15pt; font-weight: bold; text-transform: uppercase;">SERVICE KAMERA BOGOR</h2>
                <p style="margin: 2px 0 0 0; font-size: 8.5pt;">Ruko, Jl. Bumi Sentosa Raya No.7, Nanggewer Mekar, Kec. Cibinong, Kabupaten Bogor, Jawa Barat 16912</p>
                <p style="margin: 0; font-size: 8.5pt;">Telp/WA: 0895-6000-70007</p>
              </td>
              <td style="text-align: right; vertical-align: top; width: 40%;">
                <h3 style="margin: 0; font-size: 13pt; text-transform: uppercase;">BUKTI SERAH TERIMA</h3>
                <p style="margin: 3px 0 0 0; font-size: 10pt; font-weight: bold;">No. SPK: ${item.id}</p>
                <p style="margin: 0; font-size: 8.5pt;">Waktu Drop: ${item.createdAt || '-'}</p>
                <div style="margin-top: 5px; display: inline-block; border: 1px solid #000; padding: 2px 6px; font-size: 8pt; font-weight: bold; text-transform: uppercase;">STATUS: DITERIMA</div>
              </td>
            </tr>
          </table>

          <div style="font-size: 9.5pt; font-weight: bold; margin-bottom: 6px; text-transform: uppercase;">INFORMASI SERVICE & PELANGGAN</div>
          <table style="width: 100%; border-collapse: collapse; font-size: 9pt; border: 1px solid #000; margin-bottom: 15px;">
            <tr>
              <td style="padding: 6px 8px; font-weight: bold; width: 30%; border-bottom: 1px solid #000; border-right: 1px solid #000; background: #f0f0f0;">Nama Pelanggan</td>
              <td style="padding: 6px 8px; border-bottom: 1px solid #000;">${item.name}</td>
            </tr>
            <tr>
              <td style="padding: 6px 8px; font-weight: bold; border-bottom: 1px solid #000; border-right: 1px solid #000; background: #f0f0f0;">No. WhatsApp / HP</td>
              <td style="padding: 6px 8px; border-bottom: 1px solid #000;">${item.phone}</td>
            </tr>
            <tr>
              <td style="padding: 6px 8px; font-weight: bold; border-bottom: 1px solid #000; border-right: 1px solid #000; background: #f0f0f0;">Perangkat (Unit)</td>
              <td style="padding: 6px 8px; border-bottom: 1px solid #000;"><strong>${item.type} - ${item.model}</strong></td>
            </tr>
            <tr>
              <td style="padding: 6px 8px; font-weight: bold; border-bottom: 1px solid #000; border-right: 1px solid #000; background: #f0f0f0;">Deskripsi Keluhan</td>
              <td style="padding: 6px 8px; border-bottom: 1px solid #000;">${item.issue}</td>
            </tr>
            <tr>
              <td style="padding: 6px 8px; font-weight: bold; border-right: 1px solid #000; background: #f0f0f0;">Target Estimasi Selesai</td>
              <td style="padding: 6px 8px;"><strong>${item.targetDate ? new Date(item.targetDate).toLocaleString('id-ID') : '-'}</strong></td>
            </tr>
          </table>

          <div style="border: 1px solid #000; padding: 8px 10px; font-size: 8pt; margin-top: 15px;">
            <strong>Syarat & Ketentuan Service:</strong>
            <ol style="margin: 3px 0 0 0; padding-left: 15px;">
              <li>Bukti Tanda Terima (SPK) ini wajib ditunjukkan saat pengambilan unit barang.</li>
              <li>Pihak service tidak bertanggung jawab atas barang yang tidak diambil lebih dari 60 hari sejak konfirmasi selesai.</li>
              <li>Garansi perbaikan berlaku selama 30 hari untuk kerusakan yang sama (tidak termasuk human error / terkena air).</li>
            </ol>
          </div>

          <table style="width: 100%; margin-top: 35px; border-collapse: collapse; font-size: 9pt;">
            <tr>
              <td style="width: 50%; text-align: center; vertical-align: top;">
                <p style="margin: 0;">Yang Menyerahkan (Pelanggan),</p>
                <div style="height: 45px;"></div>
                <p style="margin: 0; font-weight: bold; text-decoration: underline;">(${item.name})</p>
              </td>
              <td style="width: 50%; text-align: center; vertical-align: top;">
                <p style="margin: 0;">Penerima (Kasir / Admin),</p>
                <div style="height: 45px;"></div>
                <p style="margin: 0; font-weight: bold; text-decoration: underline;">(Service Kamera Bogor)</p>
              </td>
            </tr>
          </table>
        </div>
      `;
      window.print();
    }

    function printInvoice(index) {
      const item = spkData[index];
      const logoHtml = logoData ? `<img src="${logoData}" style="max-height: 55px; max-width: 160px; object-fit: contain; margin-bottom: 5px;">` : '';

      document.getElementById('printableArea').innerHTML = `
